<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deep Research Dashboard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#0f172a;
    color:white;
    display:flex;
    min-height:100vh;
}

.sidebar{
    width:280px;
    background:#111827;
    padding:20px;
    border-right:1px solid #374151;
}

.sidebar h2{
    margin-bottom:20px;
}

.sidebar input,
.sidebar select,
.sidebar button{
    width:100%;
    padding:10px;
    margin-bottom:12px;
    border:none;
    border-radius:8px;
}

.sidebar button{
    background:#2563eb;
    color:white;
    cursor:pointer;
}

.main{
    flex:1;
    display:flex;
    flex-direction:column;
}

.header{
    padding:20px;
    border-bottom:1px solid #334155;
}

.search-bar{
    display:flex;
    gap:10px;
}

.search-bar input{
    flex:1;
    padding:12px;
    border-radius:8px;
    border:none;
}

.search-bar button{
    padding:12px 20px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.content{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
    padding:20px;
}

.results,
.notes{
    background:#1e293b;
    border-radius:12px;
    padding:20px;
}

.result-card{
    background:#334155;
    padding:15px;
    border-radius:10px;
    margin-top:12px;
}

.result-card h3{
    margin-bottom:8px;
}

.notes textarea{
    width:100%;
    height:300px;
    background:#0f172a;
    color:white;
    border:1px solid #334155;
    padding:12px;
    border-radius:8px;
}

.footer{
    padding:10px 20px;
    border-top:1px solid #334155;
    color:#94a3b8;
}
</style>
</head>
<body>

<div class="sidebar">
    <h2>Research Filters</h2>

    <select>
        <option>All Sources</option>
        <option>News</option>
        <option>Academic</option>
        <option>Public Records</option>
        <option>Reports</option>
    </select>

    <select>
        <option>Any Date</option>
        <option>Last 24 Hours</option>
        <option>Last Week</option>
        <option>Last Month</option>
    </select>

    <button>Export Findings</button>
</div>

<div class="main">

    <div class="header">
        <div class="search-bar">
            <input id="query" placeholder="Enter research topic...">
            <button onclick="runSearch()">Search</button>
        </div>
    </div>

    <div class="content">

        <div class="results">
            <h2>Search Results</h2>

            <div id="resultsContainer">

                <div class="result-card">
                    <h3>Ready</h3>
                    <p>Enter a search term to begin research.</p>
                </div>

            </div>
        </div>

        <div class="notes">
            <h2>Investigation Notes</h2>
            <br>
            <textarea placeholder="Write notes here..."></textarea>
        </div>

    </div>

    <div class="footer">
        Deep Research Dashboard
    </div>

</div>

<script>

function runSearch(){

    const query =
        document.getElementById("query").value;

    const results =
        document.getElementById("resultsContainer");

    results.innerHTML = "";

    for(let i=1;i<=5;i++){

        results.innerHTML += `
        <div class="result-card">
            <h3>${query} Result ${i}</h3>
            <p>
            Research summary placeholder for
            "${query}".
            Connect this interface to your
            preferred search API or database.
            </p>
        </div>
        `;
    }
}

</script>

</body>
</html>
